---
excludes:
  paths:
    - pattern: 'package-lock.json'
      reason: 'BUILD_TOOL_OF'
  scopes:
    - pattern: 'devDependencies'
      reason: 'DEV_DEPENDENCY_OF'
      comment: 'Packages for development only.'
license_choices:
  repository_license_choices:
    - given: 'GPL-2.0-only OR MIT'
      choice: 'MIT'
    - given: 'GPL-3.0-or-later OR MIT'
      choice: 'MIT'
resolutions:
  rule_violations:
    - message: "No license information is available for dependency \
        'NPM::union:0\\.5\\.0'\\."
      reason: 'CANT_FIX_EXCEPTION'
      comment: 'The dependency has MIT license in github repo'
    - message: "The repository license choices, in the \\.ort\\.yml file, \
        contain the following 'given' expressions which are not applicable.*"
      reason: 'CANT_FIX_EXCEPTION'
      comment: >-
        License choices are kept in sync with the development branch template.
        Applicable packages may be absent in this feature branch.
  issues:
    - message: '.*@epam/ai-dial-chat-shared.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/ai-dial-conversation-input.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/ai-dial-conversation-panel.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/ai-dial-conversation-stages.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/chat-api@.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/chat-api-client.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
    - message: '.*@epam/chat@.*'
      reason: 'CANT_FIX_ISSUE'
      comment: 'Internal workspace package not published to npm registry.'
