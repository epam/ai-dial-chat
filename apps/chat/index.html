<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>AI DIAL Chat</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI DIAL Chat: talk to AI models, applications and agents in one workspace."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Latin Inter subset: every page draws basic Latin text, and the
         browser otherwise finds this font only after the stylesheet loads.
         Vite rewrites the path to the same hashed asset the CSS references. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />
    <!-- Synchronous on purpose: paints the stored theme before first render. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
