schema: spec-driven

context: |
  # AI DIAL Chat

  ## Tech Stack
  - Monorepo: Nx 22
  - Frontend: React 19, Vite 8 (apps/chat, port 4207)
  - Backend: NestJS 11 (apps/chat-api, port 3005)
  - Language: TypeScript 5.9 (strict mode, noUnusedLocals, noUnusedParameters)
  - Frontend module resolution: Vite-built apps and libs use `module: esnext` with
    `moduleResolution: bundler`; relative TypeScript source imports omit `.js`/`.ts` extensions
  - Styling: Tailwind CSS 3 (primary) + SCSS (component overrides only)
  - i18n: react-i18next + i18next-browser-languagedetector (keys in apps/chat/src/i18n/locales/en.json)
  - State: React Context + custom hooks (no external state management library)
  - API layer: generated `@epam/chat-api-client` wrappers in apps/chat/src/server-api/ for REST endpoints.
    `apps/chat/src/server-api/base.ts` is legacy/infrastructure support (CSRF, unauthorized handling,
    streaming, and temporary exceptions only), not the default path for new business endpoints.
  - Routing: React Router v6 (BrowserRouter, lazy-loaded routes)
  - Testing: Vitest 4 + @testing-library/react 16 (frontend), supertest 7 (backend)
  - Linting: ESLint 9 flat config (eslint.config.mjs) + Prettier 3
  - Commits: Conventional commits — feat/fix/chore/refactor/test/docs with optional scope

  ## Libraries
  - @epam/ai-dial-typescript-sdk: Preferred server-side DIAL Core client in apps/chat-api
  - @epam/ai-dial-ui-kit: Design system base components
  - @tabler/icons-react: Icon set — use for all icons, no inline SVGs
  - react-i18next / i18next: Internationalisation
  - class-validator + class-transformer: NestJS DTO validation and serialisation
  - @nestjs/swagger: OpenAPI documentation
  - @nestjs/throttler: Rate limiting
  - @nestjs/cache-manager + cache-manager: In-memory cache
  - helmet: Security headers
  - prettier-plugin-tailwindcss: Tailwind class ordering

  ## Path Aliases
  - @/*        → apps/chat/*
  - @epam/ai-dial-conversation-input/* → libs/conversation-input/*
  - @epam/ai-dial-chat-shared/*        → libs/chat-shared/*

  ## Commands
  - Frontend dev: `npm start` (localhost:4207, proxies /api → localhost:3005)
  - Backend dev:  `npm run start:api` (localhost:3005)
  - Both:         `npm run start:all`
  - Affected build / lint / typecheck / test: `npm exec nx affected --target=<t> --base=origin/development-1.0`
  - Single-project (preferred for slice verification, see CLAUDE.md per project):
    - `npm exec nx test chat-api`
    - `npm exec nx lint chat-api`
    - `npm exec nx build chat-api`
  - All tests:    `npm test`
  - Dep graph:    `npm run graph`

  Default base branch for `nx affected` is `origin/development-1.0`. Do NOT use `origin/main`.

  ## Architecture

  ### Frontend (apps/chat)
  - Entry: apps/chat/src/main.tsx — wraps app in BrowserRouter + ThemeProvider
  - App: apps/chat/src/app/app.tsx — root component, lazy-loads routes with Suspense
  - Context: apps/chat/src/context/ — React Context providers and their consumer hooks
    - ThemeContext.tsx is the reference pattern: createContext<T | undefined>(undefined),
      useMemo on context value, guard hook throws if used outside provider
  - Hooks: apps/chat/src/hooks/ — custom hooks co-located by concern
    - useFavicon.ts is the reference pattern: JSDoc, AbortController/cleanup in useEffect,
      cancelled flag for async operations, and async/await instead of Promise chains
  - Components: apps/chat/src/components/{ComponentName}/{ComponentName}.tsx
    - Folder name must be PascalCase and match the component name exactly (e.g. RequireAuth/RequireAuth.tsx)
    - Tests go in a tests/ subfolder inside the component folder (e.g. RequireAuth/tests/RequireAuth.spec.tsx)
  - API: apps/chat/src/server-api/ — thin domain wrappers around generated `@epam/chat-api-client`
    APIs. New REST business endpoints must be exposed through the generated client; use raw
    `base.ts` helpers only for documented generator gaps, streaming, or infrastructure endpoints.
  - i18n: apps/chat/src/i18n/ — i18next config + locale JSON files

  ### Backend (apps/chat-api)
  - Entry: apps/chat-api/src/main.ts — registers Helmet, ValidationPipe, CORS, URI versioning,
    Swagger; serves compiled frontend static files from apps/chat/dist with SPA fallback
    for non-/api/* routes
  - Domains: apps/chat-api/src/{domain}/ — one folder per domain, NO `modules/` wrapper
    (e.g. apps/chat-api/src/themes/theme.controller.ts, theme.service.ts, theme.module.ts, dto/)
  - Business endpoints are URI-versioned at /api/v{N}/{resource}; infrastructure endpoints
    (health, metrics) are exempt and stay at /api/{resource}
  - Config: apps/chat-api/src/config/environment.config.ts — class-validator env validation
  - Common: apps/chat-api/src/common/interceptors/ — MetricsInterceptor is the reference pattern
  - Full NestJS conventions live in apps/chat-api/AGENTS.md — read it before designing or
    implementing anything inside apps/chat-api/**

  ### Libraries
  - libs/chat-shared/  — shared TypeScript interfaces and types only (no logic)
  - libs/conversation-input/  — ConversationInput React component
  - Libraries under libs/* are host-agnostic: host/external integration knowledge stays in
    app-level adapters and is passed in via props, callbacks, or resolved values. See
    AGENTS.md §Library isolation for the full boundary rules and the libs/chat-api-client/
    generated-client exception — do NOT restate them here.

  ### Module boundary rules
  - apps may import from libs; apps may not import from each other
  - type:ui libs may import from chat-shared only
  - type:shared libs (chat-shared) import nothing
  - libs may not import from apps, server-api wrappers, generated API clients, backend DTOs,
    app providers/contexts, config/env, storage, analytics, routing, or SDK singletons; the
    only generated-client exception is code inside libs/chat-api-client/ itself
  - Enforced by @nx/enforce-module-boundaries in eslint.config.mjs

rules:
  # Coding conventions (arrow functions, component folder structure, etc.) are defined in
  # CLAUDE.md — this rules block governs proposal/design/spec/task quality only.

  proposal:
    - 'Keep proposals concise but include every required section: Problem, Solution, Non-goals,
      Acceptance criteria (how we know the change is done and correct).'
    - >-
      Compare alternatives before committing. For broad or architectural changes, weigh 2-4
      options (include a conservative baseline) oтn correctness, complexity/delivery risk,
      security/performance, and migration/rollback, then state the pick and why the rest were
      rejected (prevents re-litigation). Base any "best practice" claim on authoritative sources;
      separate facts from assumptions and flag unknowns explicitly. For small changes, a one-line
      alternatives-considered is enough.
    - Include a rollback / backward-compat note — is this breaking, and how do we revert it?
    - Investigate the codebase before proposing — check if the pattern already exists in
      context/, hooks/, server-api/, or common/. Cite the closest existing file as `path:line`
      to prove the investigation happened.
    - Reference the closest existing file as the model (e.g. "follow ThemeContext pattern",
      "follow useFavicon pattern", "follow ThemeController pattern")
    - Flag scope creep — if the proposal touches shared libs or global providers, call it out
    - If the proposal touches libs/*, state how host/external integration knowledge stays outside
      the lib boundary and which app-level adapter, prop, callback, or resolved value carries it
    - Ask clarifying questions before finalising — especially around state ownership and
      whether the feature needs a new context or can use an existing one
    - Include impact on i18n: does this introduce new user-visible strings?

  design:
    # Code-syntax conventions (Tailwind, mergeClasses, icons, props/component syntax,
    # import extensions, async/await, void, event-handler naming, semantic HTML, aria-label
    # i18n) are NOT repeated here — they auto-load from .claude/rules/*.md and AGENTS.md when
    # matching files are touched. This block governs design decisions only.
    - 'All user-visible strings go through react-i18next useTranslation — key format: {domain}.{element}'
    - Use the generated `@epam/chat-api-client` through apps/chat/src/server-api/api-client.ts
      and thin domain wrappers in apps/chat/src/server-api/. Do not call `fetch` directly in
      components or hooks, and do not add new `base.ts` get/post/put/del wrappers for business
      endpoints unless the design documents a generated-client gap.
    - If the design touches hand-authored libs/*, follow .claude/rules/libs.md and AGENTS.md
      §Library isolation — state which app-level adapter, prop, callback, or resolved value
      carries host/external integration knowledge so it stays outside the lib boundary
      (libs/chat-api-client/ is the generated-client exception).
    - Fetch inside useEffect with a cancelled flag to prevent setState-on-unmount warnings
    - Context value must be wrapped in useMemo — prevents all consumers re-rendering on
      every parent render
    - Consumer hooks (e.g. useTheme) must throw a clear error when used outside the provider
    - React Context providers and their hooks go in apps/chat/src/context/ — not co-located
      with components
    - Custom hooks go in apps/chat/src/hooks/ — one hook per file, JSDoc required explaining WHY
    - Lazy-load every route component with React.lazy + Suspense — always provide a fallback
    - 'For named exports from lazy-loaded libs: use async React.lazy loaders, await the import,
      then return { default: module.X }'
    - For anything under apps/chat-api/**, follow apps/chat-api/AGENTS.md as the source of
      truth (URI versioning, thin controllers + Swagger, Logger + ConfigService, validated
      DTOs with allowlist @Matches, typed HTTP exceptions, env on EnvironmentVariables).
      Do NOT duplicate or paraphrase those rules in the design — reference the section.
    - For DIAL Core integrations in apps/chat-api/**, prefer @epam/ai-dial-typescript-sdk
      via the shared AppService SDK client. Use raw fetch only for non-DIAL upstreams or
      SDK gaps, and document why the exception is needed.
    - Apply ARIA attributes for dynamic content — role="log" + aria-live="polite" for chat
      messages, role="alert" for errors
    - Design explicit loading, empty, and error states for any new UI surface — not just the
      happy path
    - State authorization for each new endpoint — who may call it and which roles are required

  specs:
    - Specify which context or hook owns the state being introduced
    - Define the API endpoint shape if the feature requires a new backend endpoint
      (HTTP method, full versioned path like /api/v1/{resource} for business endpoints,
      request body, response body, error codes including 4xx and 5xx). Include a concrete
      example request and response payload, not just DTO names.
    - >-
      For every new or changed business endpoint, specify generated-client impact:
      OpenAPI operationId / SDK method name, request DTO, response DTO, and whether frontend
      callers use normal or `Raw` generated methods.
    - If endpoint data or any host/external behavior is consumed by a hand-authored lib, define
      the app-level adapter contract (prop, callback, or resolved value) and keep endpoint
      paths/client details plus all other host-owned integration details out of the lib.
    - Include i18n key names for all new user-visible strings
    - State the RTL / direction impact for any new UI — whether it needs logical properties
      and icon mirroring (see .claude/rules/rtl.md); say "none" only when the surface is
      direction-agnostic
    - State whether the feature is gated behind ENABLED_FEATURES / ENABLED_FEATURES_ROLES
      (see docs/ENABLED_FEATURES_ROLES.md), and which feature key/roles apply
    - Flag any memoisation requirements (useMemo, useCallback, React.memo)
    - Define accessibility requirements — keyboard navigation, ARIA roles/labels
    - State observability/telemetry requirements where the feature needs metrics or analytics
      (which events/metrics, where they are emitted)
    - Specify rate limiting requirements for new NestJS endpoints (per-route @Throttle
      when stricter than the global default)
    - Include cache TTL and invalidation strategy for new cached data — state the cache key
      (naming <domain>:<resource>[:<param>]), the TTL, AND the event that triggers invalidation

  tasks:
    - Order tasks as thin vertical slices with explicit dependencies — each slice independently
      verifiable (not one big-bang task list)
    - >-
      Choose and state a slicing strategy — vertical (default; one path through the stack working
      end to end before widening), contract-first (agree types/OpenAPI, then build both sides in
      parallel), or risk-first (prove the highest-risk part before building on it)
    - Scope discipline — each task touches only what it requires. No drive-by cleanup or refactors
      in untouched files. Record out-of-scope findings as explicit follow-up tasks, not inline edits
    - Reference specific file paths — never vague descriptions like "update the service"
    - Follow the file location conventions:
        - Frontend — context in apps/chat/src/context/, hooks in apps/chat/src/hooks/,
          API wrappers in apps/chat/src/server-api/ that delegate to `@epam/chat-api-client`
        - Backend — domains in apps/chat-api/src/{domain}/ (NO `modules/` wrapper);
          see apps/chat-api/AGENTS.md §1 for the full layout
    - Before writing tasks that touch apps/<app>/** or libs/<lib>/**, read the corresponding
      AGENTS.md (e.g. apps/chat-api/AGENTS.md for chat-api work) so task wording matches the
      conventions of that project
    - For TypeScript source changes, require extensionless relative code imports and preserve
      extensions only for resources or explicit package subpaths; frontend Vite projects must
      retain bundler module resolution
    - >-
      For tasks that touch hand-authored libs/*, include an explicit architecture guard: verify
      the lib does not contain host-owned integration details such as hardcoded `/api` paths,
      generated API/client imports, server-api imports, app contexts, auth/session/cookie/env
      access, feature flags, route/navigation knowledge, analytics/telemetry/logging clients,
      deployment/tenant/provider details, third-party SDK setup, platform bridges, or app-specific
      storage behavior. libs/chat-api-client/ is the generated OpenAPI-client exception; tasks
      touching it should update backend Swagger/OpenAPI sources and run the OpenAPI generation
      checks instead of hand-editing generated files.
    - Require unit tests for all new hooks, utilities, and services as a dedicated task
    - Require integration tests (supertest) for all new NestJS controllers as a dedicated task
    - Tests co-locate with source — frontend components use a tests/ subfolder
      (ComponentName/tests/ComponentName.spec.tsx); backend specs sit next to the source file
      (feature.controller.spec.ts next to feature.controller.ts)
    - Test names describe observable behaviour — not implementation details
    - Tests must use role, label, and text queries instead of implementation-specific selectors
    - Do not add manual testing tasks
    - Add i18n keys to en.json as a dedicated task when new strings are introduced
    - Add a dedicated RTL task for new UI — logical Tailwind classes (ms/me, ps/pe, start/end),
      directional-icon mirroring, and an RTL check (see .claude/rules/rtl.md)
    - Add a feature-flag wiring task when the spec gates the feature behind
      ENABLED_FEATURES / ENABLED_FEATURES_ROLES
    - Add a docs-update task when the change alters behavior documented under docs/
      (feature flags, viewers, theming, auth, architecture)
    - For any new or changed business HTTP endpoint, include dedicated tasks to:
        - update Swagger DTO/response annotations in apps/chat-api so the endpoint appears in
          `libs/chat-api-client/openapi.json` with strong types
        - run `npm run openapi` and `npm run openapi:check`
        - build and lint `chat-api-client`
        - add or update the generated API singleton in `apps/chat/src/server-api/api-client.ts`
        - implement frontend server-api wrappers using `@epam/chat-api-client`, not direct
          `base.ts` helpers, unless the task documents a generator gap
    - Verify per slice — run lint + typecheck + tests after each slice using
      `npm exec nx <target> chat-api` for single-project checks, then close with one final
      `npm exec nx affected --target=<t> --base=origin/development-1.0` run over the affected set
