# Wrapped agent template — for adopting a third-party GitHub Action that
# isn't a generic Claude prompt. The manifest exists for catalog/governance
# purposes; the actual run is a self-triggered specialized workflow at
# .github/workflows/stage-<name>.yml (because GHA's static `uses:` constraint
# means each wrapped action needs its own workflow file).
#
# See stage-security-review.yml for the worked example.

contract_version: "0.1"
name: my-wrapped-agent
agent_version: "0.1.0"
description: "Adopts <third-party-action> as an SDLC agent."
triggers: [pull_request]

# Required by schema, but ignored at runtime for Wrapped agents (the
# specialized workflow defines what tools the third-party action has).
allowed_tools: "Read"

invocation:
  pattern: wrapped
  action_ref: org/third-party-action@<pinned-sha>

source:
  origin: adopted
  url: https://github.com/org/third-party-action
  sha: <pinned-sha>
license: Apache-2.0
vetting_report: agents/my-wrapped-agent/vetting-report.md

phase: pilot
cost_class: light
