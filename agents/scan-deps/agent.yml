contract_version: "0.1"
name: scan-deps
skill: dep-scan
agent_version: "0.1.0"
description: "Filesystem dependency scan (Trivy). Detects known CVEs in repo lockfiles and emits structured findings for downstream triage."
triggers: [pull_request]
allowed_tools: "Read,Glob,Bash(trivy:*),Skill"
tools:
  extra:
    - name: trivy
      version: "0.69.0"
      # `sudo sh -s --` runs the install script's final binary move with
      # root. /usr/local/bin isn't writable by the runner user on
      # GitHub-hosted ubuntu-latest; passwordless sudo is available.
      install: "curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v{{version}}"
model: claude-sonnet-4-6
phase: pilot
cost_class: medium
