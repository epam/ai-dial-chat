contract_version: "0.1"
name: scan-deps
skill: dep-scan
agent_version: "0.1.0"
description: "Filesystem dependency scan (Trivy). Detects known CVEs in repo lockfiles and emits structured findings for downstream triage."
triggers: [pull_request]
allowed_tools: "Read,Glob,Bash(trivy:*),Skill"
tools:
  extra:
    - name: trivy
      version: "0.69.0"
      # Install into the runner user's $HOME/.local/bin to avoid sudo and
      # /usr/local/bin permission/env issues entirely. Append the dir to
      # $GITHUB_PATH so subsequent steps in this job (including the agent's
      # Bash tool calls) see the binary on PATH.
      install: 'mkdir -p "$HOME/.local/bin" && curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin" v{{version}} && echo "$HOME/.local/bin" >> "$GITHUB_PATH"'
model: claude-sonnet-4-6
phase: pilot
cost_class: medium
