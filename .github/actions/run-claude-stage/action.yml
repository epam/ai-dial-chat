name: 'Run Claude Stage'
description: 'Run a Claude-powered DIAL SDLC stage. Validates output and posts a sticky PR comment.'

inputs:
  stage_name:
    description: 'Stage identifier (kebab-case). Must match prompt filename and sticky-comment marker.'
    required: true
  allowed_tools:
    description: 'Comma-separated allowed tools (e.g. "Read,Grep,Glob,Skill").'
    required: true
  prompt:
    description: 'Inline prompt. If empty, falls back to prompt_file or the default convention.'
    required: false
    default: ''
  prompt_file:
    description: 'Explicit prompt file path. Used when manifest-driven dispatcher provides it. If empty, falls back to .github/claude/prompts/{stage_name}.md.'
    required: false
    default: ''
  agent_version:
    description: 'Stage/agent version (semver) recorded into the output envelope.'
    required: false
    default: 'unknown'
  model:
    description: 'Claude model to invoke (e.g. claude-sonnet-4-6). Empty means use claude-code-action default.'
    required: false
    default: ''
  max_turns:
    description: 'Max Claude turns.'
    required: false
    default: '25'

outputs:
  message:
    description: 'Validated sticky JSON payload from the stage.'
    value: ${{ steps.extract.outputs.json }}
  status:
    description: 'Stage status (passed | passed_with_findings | failed).'
    value: ${{ steps.extract.outputs.status }}

runs:
  using: composite
  steps:
    - name: Validate ANTHROPIC_API_KEY env
      shell: bash
      run: |
        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "::error::ANTHROPIC_API_KEY env is not set. Set it on the calling job from secrets.ANTHROPIC_API_KEY."
          exit 1
        fi

    - name: Prepare prompt, schema, and Claude args
      id: prep
      shell: bash
      env:
        STAGE_NAME: ${{ inputs.stage_name }}
        INLINE_PROMPT: ${{ inputs.prompt }}
        EXPLICIT_FILE: ${{ inputs.prompt_file }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MODEL: ${{ inputs.model }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail

        # 1) Resolve prompt content. claude-code-action@v1 accepts `prompt:`
        # (string) only — no prompt_file input — so we read the file here.
        if [ -n "${INLINE_PROMPT}" ]; then
          PROMPT_CONTENT="${INLINE_PROMPT}"
        else
          if [ -n "${EXPLICIT_FILE}" ]; then
            FILE="${EXPLICIT_FILE}"
          else
            FILE=".github/claude/prompts/${STAGE_NAME}.md"
          fi
          if [ ! -f "$FILE" ]; then
            echo "::error::Prompt file not found: $FILE"
            exit 1
          fi
          PROMPT_CONTENT="$(cat "$FILE")"
        fi

        # 2) Build an agent-facing JSON Schema: strip envelope fields the
        # platform injects, pin `stage` to a literal const so Claude can't
        # write the wrong stage name. Saved to a temp file for --json-schema.
        SCHEMA_PATH="${RUNNER_TEMP}/agent-schema.json"
        export STAGE_NAME SCHEMA_PATH
        python3 - <<'PY'
        import json, os
        with open('.github/claude/schemas/stage-message.schema.json') as f:
            s = json.load(f)
        # Envelope fields are injected by render-stage-comment.py; agents must not write them.
        for k in ('contract_version', 'agent_version', 'run_id', 'trigger'):
            s.get('properties', {}).pop(k, None)
        s['required'] = [r for r in s.get('required', []) if r != 'contract_version']
        # Pin the stage name so Claude can't mismatch.
        s.setdefault('properties', {}).setdefault('stage', {'type': 'string'})['const'] = os.environ['STAGE_NAME']
        with open(os.environ['SCHEMA_PATH'], 'w') as f:
            json.dump(s, f)
        PY
        echo "Agent-facing schema written to $SCHEMA_PATH"

        # 3) Build claude_args. Allowed tools, model, and json-schema all go
        # through the CLI via claude_args; the action exposes none as direct inputs.
        ARGS="--max-turns ${MAX_TURNS} --json-schema=${SCHEMA_PATH}"
        if [ -n "${MODEL}" ]; then
          ARGS="${ARGS} --model ${MODEL}"
        fi
        if [ -n "${ALLOWED_TOOLS}" ]; then
          # Single-quote the value to preserve patterns like `Bash(git diff:*)`.
          ARGS="${ARGS} --allowed-tools '${ALLOWED_TOOLS}'"
        fi

        echo "claude_args=${ARGS}" >> "$GITHUB_OUTPUT"
        {
          echo "prompt<<PROMPT_EOF"
          echo "$PROMPT_CONTENT"
          echo "PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run Claude
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        prompt: ${{ steps.prep.outputs.prompt }}
        claude_args: ${{ steps.prep.outputs.claude_args }}

    - name: Materialize structured output as stage-output.json
      shell: bash
      env:
        OUTPUT: ${{ steps.claude.outputs.structured_output }}
      run: |
        set -euo pipefail
        if [ -z "$OUTPUT" ]; then
          echo "::error::claude-code-action did not return structured_output. Either --json-schema was not honored, the model does not support structured outputs (requires Sonnet 4.5+ / Opus 4.5+ / Haiku 4.5+), or the agent hit error_max_structured_output_retries."
          exit 1
        fi
        printf '%s' "$OUTPUT" > stage-output.json
        echo "Wrote structured output to stage-output.json ($(wc -c < stage-output.json) bytes)"

    - name: Validate and render sticky comment
      id: extract
      shell: bash
      env:
        STAGE_NAME: ${{ inputs.stage_name }}
        AGENT_VERSION: ${{ inputs.agent_version }}
      run: python3 ./.github/claude/scripts/render-stage-comment.py

    - name: Upload stage output artifact
      if: always() && hashFiles('stage-output.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: stage-output-${{ inputs.stage_name }}
        path: stage-output.json
        retention-days: 90
        if-no-files-found: warn

    - name: Post sticky PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        STAGE_NAME: ${{ inputs.stage_name }}
        BODY: ${{ steps.extract.outputs.comment }}
      run: |
        set -euo pipefail
        MARKER="<!-- dial-sdlc:${STAGE_NAME} -->"
        EXISTING_ID="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' \
          | head -n1)"
        if [ -n "$EXISTING_ID" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" -f body="$BODY" > /dev/null
          echo "Updated sticky comment $EXISTING_ID"
        else
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
          echo "Created sticky comment for stage ${STAGE_NAME}"
        fi