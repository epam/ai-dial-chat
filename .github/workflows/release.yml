name: Release Workflow

on:
  push:
    branches: [development-1.0, release-1.*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (for release-1.* branches only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/node_release.yml@4.7.1
    with:
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
      node-version: 24
      filter-version: '1\.[0-9]+'
      primary-branch-pattern: '^development-1\.0$'
      release-branch-pattern: '^release-1\.[0-9]+$'
      docker-development-tag: 'development-1.0'
      maximize-build-space: true
      draft-stable-releases: true
      # ORT 90: fixes ORT 85 NPM graph mapping (analyzer: ~25m → ~3m)
      ort-version: "90.0.0"
      # ort-config-revision for ORT 90
      ort-config-revision: "605e909bfe81ee916f66533b7139ac5bdaf1081c"
    secrets: inherit
