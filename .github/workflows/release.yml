name: Release Workflow

on:
  push:
    branches: [development, release-*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (for release-* branches only)

permissions:
  id-token: write
  contents: write
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_CONFIG_VCS_REVISION: 5650fed55a20397b9abb9017a0c6bb674dc8481d

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@fix-ort-config-vcs-revision
    with:
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
      node-version: 24
      maximize-build-space: true
      draft-stable-releases: true
    secrets: inherit
