name: Deploy development

on:
  workflow_dispatch: # manual run
  workflow_run:
    workflows: ["Release Workflow"]
    types:
      - completed

permissions: {}

jobs:
  trigger-0x:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.ref == 'refs/heads/development-0.x') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development-0.x')
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment-name: "development-old"
            gitlab-project-id: "3612"
          - environment-name: "development-overlay-old"
            gitlab-project-id: "3613"

    name: Deploy to ${{ matrix.environment-name }}
    uses: epam/ai-dial-ci/.github/workflows/deploy-development.yml@4.12.0
    with:
      gitlab-project-id: ${{ matrix.gitlab-project-id }}
      environment-name: ${{ matrix.environment-name }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
      DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}

  trigger:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.ref == 'refs/heads/development') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development')
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment-name: "development"
            gitlab-project-id: "2977"
          - environment-name: "development-overlay"
            gitlab-project-id: "3016"
          - environment-name: "development-mcp-app-sandbox"
            gitlab-project-id: "3614"  

    name: Deploy to ${{ matrix.environment-name }}
    uses: epam/ai-dial-ci/.github/workflows/deploy-development.yml@4.12.0
    with:
      gitlab-project-id: ${{ matrix.gitlab-project-id }}
      environment-name: ${{ matrix.environment-name }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
      DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
