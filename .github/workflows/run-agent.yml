name: SDLC / Run Agent

on:
  workflow_call:
    inputs:
      agent_name:
        required: true
        type: string
      upstream_artifacts:
        description: 'Comma-separated agent names whose stage-output artifacts to download into upstream/{name}/ before running.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-${{ inputs.agent_name }}-${{ github.ref }}"
      cancel-in-progress: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install YAML parser
        run: pip install --quiet pyyaml

      - name: Download upstream artifacts
        if: inputs.upstream_artifacts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream_artifacts }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p upstream
          IFS=',' read -ra NAMES <<< "$UPSTREAM"
          for name in "${NAMES[@]}"; do
            [ -z "$name" ] && continue
            echo "Downloading stage-output-${name} from this run..."
            gh run download "$RUN_ID" -R "$REPO" -n "stage-output-${name}" -D "upstream/${name}/"
          done
          echo "Upstream payloads available at:"
          find upstream/ -type f -name 'stage-output.json'

      - name: Load manifest
        id: manifest
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
        run: |
          set -euo pipefail
          MANIFEST="agents/${AGENT_NAME}/agent.yml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, yaml
          with open(f"agents/{os.environ['AGENT_NAME']}/agent.yml") as f:
              m = yaml.safe_load(f) or {}
          tools = m.get("allowed_tools")
          if not tools:
              raise SystemExit("::error::manifest missing required field: allowed_tools")
          print(f"allowed_tools={tools}")
          print(f"agent_version={m.get('agent_version', 'unknown')}")
          print(f"model={m.get('model', '')}")
          print(f"prompt_file=agents/{os.environ['AGENT_NAME']}/prompt.md")
          EOF

      - id: stage
        uses: ./.github/actions/run-claude-stage
        with:
          stage_name: ${{ inputs.agent_name }}
          allowed_tools: ${{ steps.manifest.outputs.allowed_tools }}
          agent_version: ${{ steps.manifest.outputs.agent_version }}
          model: ${{ steps.manifest.outputs.model }}
          prompt_file: ${{ steps.manifest.outputs.prompt_file }}