name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_agent_docs:
    name: Validate agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test agent-config validator
        run: npm run validate:agent-docs:test
      - name: Validate agent configuration
        run: npm run validate:agent-docs
      # Source-only: README coverage/identity, lib package metadata, lib
      # stylesheet exports, relative links, README imports vs public exports.
      # Needs no build, so it belongs in this fast job.
      - name: Validate documentation and lib manifests
        run: npm run validate:docs

  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.12.0
    with:
      node-version: 24
      maximize-build-space: false
      # node_test.yml runs `npm run format` (prettier --write) and `npm run lint`
      # (nx lint --fix, then prettier --write again): both rewrite files on the
      # runner instead of failing, so neither job can catch a formatting or
      # auto-fixable lint violation. The `typecheck` job below runs the
      # non-mutating `npm run lint:check` instead.
      format-checks-enabled: false
      style-checks-enabled: false
    secrets: inherit

  # Repository-owned: run_tests delegates to epam/ai-dial-ci/.github/workflows/node_pr.yml@4.12.0,
  # whose remaining code_checks job is `npm run test` (Vitest, which strips types
  # without checking them) — it neither lints nor typechecks. Scope: every project
  # with a `lint`/`typecheck` target. Typecheck runs even when lint fails, so a
  # single PR run reports both.
  typecheck:
    name: Workspace lint, format and typecheck (all projects)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Lint and format check all projects
        run: npm run lint:check
      - name: Typecheck all projects
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm exec nx run-many -- -t typecheck --all

  # Validates apps/mcp-app-sandbox/Dockerfile builds, mirroring node_pr.yml's own
  # docker_build job (build-only, no push) since that reusable workflow only builds
  # one Dockerfile per call. Kept as its own job so it runs in parallel with run_tests.
  docker_build_mcp_app_sandbox:
    name: Build mcp-app-sandbox image (validation only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      # HACK: jobs.<job_id>.if does not support hashFiles function, so we check it on the step
      - if: ${{ hashFiles('apps/mcp-app-sandbox/Dockerfile') != '' }}
        uses: epam/ai-dial-ci/actions/build_docker@4.11.0
        with:
          image-names: ghcr.io/${{ github.repository }}-mcp-app-sandbox
          image-tags: test
          dockerfile-path: apps/mcp-app-sandbox/Dockerfile

  # Validates apps/chat-api/Dockerfile (the BFF-only image) builds, build-only, for the
  # same reason as docker_build_mcp_app_sandbox above.
  docker_build_bff:
    name: Build BFF image (validation only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      # HACK: jobs.<job_id>.if does not support hashFiles function, so we check it on the step
      - if: ${{ hashFiles('apps/chat-api/Dockerfile') != '' }}
        uses: epam/ai-dial-ci/actions/build_docker@4.11.0
        with:
          image-names: ghcr.io/${{ github.repository }}-bff
          image-tags: test
          dockerfile-path: apps/chat-api/Dockerfile

  chat_hooks_packed:
    # Packed-package checks for @epam/ai-dial-chat-hooks, kept in one job so
    # the library and its workspace dependencies build once: every later step
    # hits the local Nx cache instead of rebuilding on a fresh runner. Checks
    # after the build keep running when an earlier one fails, so a single PR
    # run reports every broken check.
    name: chat-hooks packed-package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build @epam/ai-dial-chat-hooks and its workspace dependencies
        id: build
        run: npm exec nx run @epam/ai-dial-chat-hooks:build
      # Three representative packed consumers; the complete matrix is
      # available through the test-packed target.
      - name: Packed-package smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-smoke
      # Root and subpath bundle sizes and dependency isolation.
      - name: Per-export cold-load probes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-cold-load-probes
      # Source vs packed application JS/CSS sizes, plus a module-origin audit
      # for unexpected bundled dependencies.
      - name: Application-mode packed/source parity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-parity
      # Browser startup requests, deferred feature mounting and reopening,
      # OAuth events, markdown reload recovery, styles, and mobile RTL rendering.
      - name: Browser-observed startup parity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-browser-parity

  build_celebrations_storybook:
    # Builds the lib-local Storybook so a broken story fails the PR; the
    # output is not deployed.
    name: celebrations Storybook build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build @epam/ai-dial-celebrations Storybook
        run: npm exec nx run @epam/ai-dial-celebrations:build-storybook

  publish_lib_coherent_release:
    # Checks that packed libraries from one release install together and
    # typecheck, and that the manifest audit rejects mixed internal versions.
    name: publish-lib coherent release install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the four in-scope libraries
        run: npm exec nx run-many -- -t build -p @epam/ai-dial-chat-shared @epam/ai-dial-chat-hooks @epam/ai-dial-catalog @epam/ai-dial-publish-panel
      - name: Publish package.json transformation unit tests
        run: npm run publish:lib:test
      - name: Coherent-release install / negative mixed-release test
        run: npm run publish:lib:coherent-release-test
