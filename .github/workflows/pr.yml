name: PR Workflow

on:
  pull_request:
    branches: [development, release-*, feat/3957-add-endpoints-from-the-core]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@2.1.0
    secrets: inherit
    with:
      node-version: 22
