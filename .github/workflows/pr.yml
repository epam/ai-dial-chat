name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@29a9c6a58a4dcd31b94183c462bb0d26a812eca4
    secrets: inherit
    with:
      node_version: 22
      severity_trivy: "CRITICAL,HIGH,MEDIUM"
      limit_severities_for_sarif_trivy: false