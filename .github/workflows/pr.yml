name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_agent_docs:
    name: Validate agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test agent-config validator
        run: npm run validate:agent-docs:test
      - name: Validate agent configuration
        run: npm run validate:agent-docs
      # Source-only: README coverage/identity, lib package metadata, lib
      # stylesheet exports, relative links, README imports vs public exports.
      # Needs no build, so it belongs in this fast job.
      - name: Validate documentation and lib manifests
        run: npm run validate:docs

  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.12.0
    with:
      node-version: 24
      maximize-build-space: false
    secrets: inherit

  # Repository-owned: run_tests delegates to epam/ai-dial-ci/.github/workflows/node_pr.yml@4.11.0,
  # whose node_test.yml jobs are `npm run format` (prettier --write), `npm run lint`
  # (nx lint --fix) and `npm run test` (Vitest, which strips types without checking
  # them) — none of them typechecks. Scope: every project with a `typecheck` target
  # (32 as of this job's introduction).
  typecheck:
    name: Workspace typecheck (all projects)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck all projects
        run: npm exec nx run-many -- -t typecheck --all

  # Validates apps/mcp-app-sandbox/Dockerfile builds, mirroring node_pr.yml's own
  # docker_build job (build-only, no push) since that reusable workflow only builds
  # one Dockerfile per call. Kept as its own job so it runs in parallel with run_tests.
  docker_build_mcp_app_sandbox:
    name: Build mcp-app-sandbox image (validation only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      # HACK: jobs.<job_id>.if does not support hashFiles function, so we check it on the step
      - if: ${{ hashFiles('apps/mcp-app-sandbox/Dockerfile') != '' }}
        uses: epam/ai-dial-ci/actions/build_docker@4.12.0
        with:
          image-names: ghcr.io/${{ github.repository }}-mcp-app-sandbox
          image-tags: test
          dockerfile-path: apps/mcp-app-sandbox/Dockerfile

  chat_hooks_packed_smoke:
    # Checks three representative packed consumers on PRs.
    # The complete matrix is available through the test-packed target.
    name: chat-hooks packed-package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build @epam/ai-dial-chat-hooks and run packed-package smoke
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-smoke

  chat_hooks_cold_load_probes:
    # Checks root and subpath bundle sizes and dependency isolation.
    # Nx rebuilds each packed library and its workspace dependencies first.
    name: chat-hooks cold-load probes (root/subpath isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run per-export cold-load probes
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-cold-load-probes

  chat_hooks_application_parity:
    # Compares source and packed application JS/CSS sizes and audits
    # module origins to detect unexpected bundled dependencies.
    name: chat-hooks application-mode packed/source parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run application-mode packed/source parity
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-parity

  chat_hooks_browser_parity:
    # Checks browser startup requests, deferred feature mounting and reopening,
    # OAuth events, markdown reload recovery, styles, and mobile RTL rendering.
    name: chat-hooks browser-observed startup parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser-observed packed/source parity
        run: npm exec nx run @epam/ai-dial-chat-hooks:test-packed-browser-parity

  publish_lib_coherent_release:
    # Checks that packed libraries from one release install together and
    # typecheck, and that the manifest audit rejects mixed internal versions.
    name: publish-lib coherent release install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the four in-scope libraries
        run: npm exec nx run-many -- -t build -p @epam/ai-dial-chat-shared @epam/ai-dial-chat-hooks @epam/ai-dial-catalog @epam/ai-dial-publish-panel
      - name: Publish package.json transformation unit tests
        run: npm run publish:lib:test
      - name: Coherent-release install / negative mixed-release test
        run: npm run publish:lib:coherent-release-test
