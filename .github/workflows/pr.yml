name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4b609e81dd721f4d5153a9cae5946a5880b64345
    secrets: inherit
    with:
      node_version: 22
      limit_severities_for_sarif_trivy: false