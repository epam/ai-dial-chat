name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ORT_CONFIG_VCS_REVISION: 5650fed55a20397b9abb9017a0c6bb674dc8481d

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.3.0
    secrets: inherit
    with:
      node-version: 24
      maximize-build-space: true
