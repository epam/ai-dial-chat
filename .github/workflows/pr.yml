name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@f1de85147fd3b03ea34b10596b3e116b4d9a40ed
    secrets: inherit
    with:
      node_version: 22
      severity_trivy: "CRITICAL,HIGH,MEDIUM"
      limit_severities_for_sarif_trivy: false