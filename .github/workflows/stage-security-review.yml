name: SDLC Stage / Security Review

# DISABLED on PRs (kept as the reference example of the third-party-action
# form-factor). Security review now runs as a native orchestrator skill agent
# — agents/security-review/ wrapping the built-in /security-review skill — which
# supersedes this specialized claude-code-security-review Action (it could not
# route through DIAL; see ADR-0004). Re-enable by restoring the pull_request
# trigger, or run manually via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    if: vars.STAGE_SECURITY_REVIEW_ENABLED != 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-security-review-${{ github.ref }}"
      cancel-in-progress: true
    steps:
      - name: Validate API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set or empty"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Security Review
        id: review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          run-every-commit: true
          claude-model: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}

      - name: Comment when no findings
        if: steps.review.outputs.findings-count == '0'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Security review: no issues found.