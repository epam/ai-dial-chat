name: SDLC Dispatch / Core

# Reusable dispatch pipeline shared by every trigger-specific dispatcher
# (dispatch-pr.yml, dispatch-schedule.yml). It discovers agents whose manifests
# match the CALLER's event, then fans them out into topologically-sorted rounds
# via run-agent.yml. The triggering event is read from `github.event_name`
# (reusable workflows inherit the caller's github context), so the same core
# serves pull_request, schedule, and workflow_dispatch without modification.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  id-token: write   # required by anthropics/claude-code-action for OIDC auth
  actions: read     # caller cap: run-agent.yml's `gh run download` needs this

jobs:
  # Round-0 trust gate (ADR-0005 M1/M2). Classifies the PR source and rejects
  # the run if the PR touches agent-trust paths or adds symlinks. A no-op for
  # schedule / workflow_dispatch (no PR, runs from the trusted default branch),
  # so the same core serves every trigger. discover gates on this — a failed
  # gate blocks all rounds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      # Checkout provides the .git dir the gate needs for its symlink ls-tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: trust
        uses: ./.github/actions/pr-trust-gate
        with:
          event_name: ${{ github.event_name }}
          pr: ${{ toJSON(github.event.pull_request) }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}
          # Fork-facing posture (set when AI review opens to external forks):
          #   trust_label: ai-review-approved   # maintainer label = trust boundary
          #   fail_on_untrusted: 'false'        # branch on outputs.trusted instead
          # Defaults (hard-block forks, reject trust-path edits on all PRs) are
          # correct for the current internal-only (`pull_request`) tier.

  discover:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      round1: ${{ steps.match.outputs.round1 }}
      round2: ${{ steps.match.outputs.round2 }}
      round3: ${{ steps.match.outputs.round3 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install matcher deps
        run: pip install --quiet pyyaml jsonschema

      - id: match
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "$VARS_JSON" > /tmp/vars.json
          echo "$EVENT_JSON" > /tmp/event.json
          echo "Dispatching agents for event: $EVENT_NAME"
          ROUNDS=$(python3 .github/claude/scripts/match-agents.py "$EVENT_NAME" \
            --vars /tmp/vars.json --event-context /tmp/event.json)
          echo "Matched rounds: $ROUNDS"
          echo "round1=$(echo "$ROUNDS" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("round1", [])))')" >> "$GITHUB_OUTPUT"
          echo "round2=$(echo "$ROUNDS" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("round2", [])))')" >> "$GITHUB_OUTPUT"
          echo "round3=$(echo "$ROUNDS" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin).get("round3", [])))')" >> "$GITHUB_OUTPUT"

  run-round-1:
    name: ${{ matrix.agent.name }}
    needs: discover
    if: needs.discover.outputs.round1 != '[]'
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.round1) }}
    uses: ./.github/workflows/run-agent.yml
    with:
      agent_name: ${{ matrix.agent.name }}
      upstream_artifacts: ${{ join(matrix.agent.needs, ',') }}
      timeout_minutes: ${{ matrix.agent.timeout_minutes }}
      concurrency_group: ${{ matrix.agent.concurrency_group }}
    secrets: inherit

  run-round-2:
    name: ${{ matrix.agent.name }}
    needs: [discover, run-round-1]
    # `always()` lets round-2 fire even when a different round-1 agent
    # failed. Without it, GHA treats run-round-1 as failed-as-a-whole and
    # skips round-2 entirely — blocking downstream agents whose specific
    # `needs:` upstream DID succeed. We still gate on discover succeeding
    # so the matrix is empty rather than malformed if the matcher failed.
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.round2 != '[]'
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.round2) }}
    uses: ./.github/workflows/run-agent.yml
    with:
      agent_name: ${{ matrix.agent.name }}
      upstream_artifacts: ${{ join(matrix.agent.needs, ',') }}
      timeout_minutes: ${{ matrix.agent.timeout_minutes }}
      concurrency_group: ${{ matrix.agent.concurrency_group }}
    secrets: inherit

  run-round-3:
    name: ${{ matrix.agent.name }}
    needs: [discover, run-round-2]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.round3 != '[]'
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.round3) }}
    uses: ./.github/workflows/run-agent.yml
    with:
      agent_name: ${{ matrix.agent.name }}
      upstream_artifacts: ${{ join(matrix.agent.needs, ',') }}
      timeout_minutes: ${{ matrix.agent.timeout_minutes }}
      concurrency_group: ${{ matrix.agent.concurrency_group }}
    secrets: inherit